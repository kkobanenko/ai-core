[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-core"
version = "0.3.1"
description = "Shared Phoenix tracing config, IO policy, and multi-provider bounded runtime for AI projects"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "arize-phoenix-otel==0.16.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Репозиторий в path, чтобы `tools.dev_coordinator` импортировался в тестах.
pythonpath = [".", "src"]
