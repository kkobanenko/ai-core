name: CI

on:
  push:
    branches:
      - main
      - chore/coordinator-transition-v0.1-20260911
  pull_request:
    branches:
      - main
      - chore/coordinator-transition-v0.1-20260911

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
